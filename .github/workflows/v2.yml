name: v2 audit

# Manual release gate, not a required check. Nothing runs on push or
# pull_request: the workflow exists so a maintainer can fire the full audit
# from the Actions tab before tagging a release, and so a future workflow can
# chain it in through workflow_call.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this audit run is happening (free text, goes to summary)"
        required: false
        default: "manual v2 audit"
        type: string
  workflow_call:
    inputs:
      reason:
        description: "Why this audit run is happening (free text, goes to summary)"
        required: false
        default: "chained audit run"
        type: string

permissions:
  contents: read

# A gate run should finish, not be replaced by a newer dispatch.
concurrency:
  group: v2-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manifest:
    name: Manifest consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime + test deps
        run: pip install -r requirements.txt pytest

      - name: Run manifest consistency tests
        run: pytest tests/test_manifest_consistency.py -v

  security:
    name: SSRF and DNS rebinding suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime + test deps
        run: pip install -r requirements.txt pytest

      - name: Run url_safety regression battery
        run: pytest tests/test_url_safety.py -v

      - name: Confirm syntactic integrity of safety and renderer modules
        run: |
          python3 -m py_compile \
            scripts/url_safety.py \
            scripts/render_page.py \
            scripts/fetch_page.py \
            scripts/capture_screenshot.py \
            scripts/google_auth.py \
            scripts/backlinks_auth.py

  full_pytest:
    name: Full pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Matches ci.yml: the sync_flow tests need an authenticated gh CLI to stay
      # clear of the 60/hr anonymous per-IP rate limit.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime + test deps
        # Must not be tolerated with `|| true`: several test modules call
        # sys.exit(1) at import time when a dependency is missing, so a
        # swallowed install failure resurfaces as an opaque pytest
        # INTERNALERROR instead of the pip error that caused it.
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        run: pytest tests/ -v

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files for leaked credentials
        run: |
          set -uo pipefail
          # High-signal credential patterns. Test fixtures and documented
          # placeholders are allowlisted; auth-setup.md ships a private-key
          # placeholder (BEGIN PRIVATE KEY\n...) that is not a real key.
          PATTERN='AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,}|gh[ous]_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|GOCSPX-[A-Za-z0-9_-]{20,}|sk-(proj-)?[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}'
          HITS=$(git ls-files -z \
            | xargs -0 grep -nIEH "$PATTERN" 2>/dev/null \
            | grep -vE 'DUMMY|EXAMPLE|YOUR_|REDACTED|placeholder|<[A-Z_]+>' \
            | grep -vE '^tests/|/auth-setup\.md:' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Potential leaked credentials in tracked files:"
            echo "$HITS"
            exit 1
          fi
          echo "Secret scan clean: no credentials detected in tracked files."

  audit_summary:
    name: Audit gate summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [manifest, security, full_pytest, secret_scan]
    if: always()
    steps:
      - name: Emit summary
        # Every value reaches the shell through the environment. `reason` is
        # free text from the run inputs, so interpolating it directly into the
        # script would let it execute as shell.
        env:
          REASON: ${{ inputs.reason }}
          MANIFEST: ${{ needs.manifest.result }}
          SECURITY: ${{ needs.security.result }}
          FULL_PYTEST: ${{ needs.full_pytest.result }}
          SECRET_SCAN: ${{ needs.secret_scan.result }}
        run: |
          {
            echo "## v2 audit summary"
            echo ""
            echo "- Reason: ${REASON:-not given}"
            echo "- Manifest: $MANIFEST"
            echo "- Security: $SECURITY"
            echo "- Full pytest: $FULL_PYTEST"
            echo "- Secret scan: $SECRET_SCAN"
            echo ""
            echo "All four must report 'success' before tagging."
          } >> "$GITHUB_STEP_SUMMARY"
