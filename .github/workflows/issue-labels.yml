name: Issue labels

# The Task issue form asks for an area and a priority as dropdowns, and GitHub
# renders dropdown choices as plain text in the issue body. This workflow turns
# the selected values (`area:skill`, `priority:high`, ...) into real labels and
# creates the label the first time it is needed.
#
# Editing the issue re-runs the sync: a changed dropdown removes the previous
# label before adding the new one, so the sidebar never accumulates stale
# area: or priority: entries.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Apply area and priority labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync labels from the issue body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          # Passed through the environment rather than interpolated into the
          # script, so markdown in the body cannot execute as shell.
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          grep -oE '(area|priority):(skill|script|agent|docs|infra|high|med|low)' \
            <<<"$BODY" | sort -u > desired.txt || true

          if [ ! -s desired.txt ]; then
            echo "No area: or priority: value in issue #$ISSUE."
          fi

          gh issue view "$ISSUE" --json labels --jq '.labels[].name' \
            | grep -E '^(area|priority):' > current.txt || true

          while IFS= read -r label; do
            if ! grep -qxF "$label" desired.txt; then
              gh issue edit "$ISSUE" --remove-label "$label"
              echo "Removed $label"
            fi
          done < current.txt

          while IFS= read -r label; do
            case "$label" in
              area:*)     color=1f6feb; desc="Area picked in the issue form" ;;
              priority:*) color=d93f0b; desc="Priority picked in the issue form" ;;
              *)          continue ;;
            esac
            gh label create "$label" --force --color "$color" --description "$desc"
            gh issue edit "$ISSUE" --add-label "$label"
            echo "Applied $label"
          done < desired.txt
