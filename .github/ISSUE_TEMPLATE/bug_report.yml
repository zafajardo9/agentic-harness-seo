name: Bug Report
description: Report a bug or unexpected behavior in Agentic Harness SEO
title: "[Bug]: "
labels: ["bug"]

# Field order is deliberate: identity of the setup first, then the failing
# command and its output, then what the reporter expected. `render: shell`
# on the error field gives it a highlighted code block.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! A reproducible command plus the full error
        output usually identifies the problem on its own.

        For usage questions, use
        [GitHub Discussions](https://github.com/zafajardo9/agentic-harness-seo/discussions)
        instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and discussions for this problem
          required: true

  - type: dropdown
    id: harness
    attributes:
      label: Harness
      description: Which agent harness were you running Agentic Harness SEO in?
      options:
        - Claude Code
        - Cursor
        - Cursor Cloud Agents
        - OpenAI Codex CLI
        - Google Antigravity
        - Gemini CLI
        - Cline
        - Aider
        - Other (described below)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Agentic Harness SEO version
      description: Output of `./scripts/agentic-harness-seo --version`, or the tag you installed
      placeholder: v2.6.2

  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. macOS 14, Ubuntu 24.04, Windows 11
      placeholder: macOS 14.5
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python3 --version`
      placeholder: Python 3.12.4
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command that failed
      description: e.g. `/seo audit https://example.com`
      placeholder: /seo page https://example.com
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Full error output
      description: Paste the complete terminal output, not just the last line
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Config, network setup, or a link to the page that failed
